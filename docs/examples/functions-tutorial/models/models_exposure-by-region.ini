[model exposure-by-region]
framework = wizard
description = Produces a total count of buildings in each region exposed to tsunami inundation
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_50m.tif
input-areas.layer = data/Samoa_constituencies.shp
input-areas.geoprocess = false
sample.hazards-by = closest
sample.areas-buffer = 1000
analysis.function = is_exposed
report-event-impact.filter = consequence = 1
report-event-impact.group-by[0] = area
report-event-impact.aggregate[0] = count(*) as Exposed_buildings
report-event-impact.select[0] = area.Region as Region
report-event-impact.select[1] = Exposed_buildings
report-event-impact.sort-by[0][attribute] = Region
report-event-impact.sort-by[0][direction] = ASC
reports.name[0] = impact-by-depth
report-impact-by-depth.filter = consequence = 1
report-impact-by-depth.group-by[0] = area
report-impact-by-depth.bucket-by = hazard
report-impact-by-depth.bucket-range[0] = 1
report-impact-by-depth.bucket-range[1] = 2
report-impact-by-depth.bucket-range[2] = 3
report-impact-by-depth.bucket-aggregation[0] = sum(consequence) as Exposed_buildings
report-impact-by-depth.bucket-name = Depth_m
report-impact-by-depth.select[0] = area.Region as Region
report-impact-by-depth.select[1] = Depth_m
report-impact-by-depth.sort-by[0][attribute] = Region
report-impact-by-depth.sort-by[0][direction] = ASC

