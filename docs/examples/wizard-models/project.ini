[project]
description = Example project for building models in the wizard
auto-import = true

[bookmark Building centroids SE Upolu (exposure-layer)]
description = Buildings in south-eastern Upolu, based on geometry centroid (Source: Open Street Maps)
location = data/Buildings_SE_Upolu_centroids.shp

[bookmark Samoa constituencies (area-layer)]
description = Electoral constituency boundaries for Samoa (Source: PCRAFI)
location = data/Samoa_constituencies.shp

[bookmark SPT inundation 50m grid (hazard-layer)]
description = Inundation depth from South Pacific Tsunami with 50m grid resolution
location = data/MaxEnv_All_Scenarios_50m.tif

[function exposure_risk]
description = Simple example function to classify risk based on inundation depth
location = functions/exposure_risk.py
argument-types = [building: anything, depth: nullable(floating)]
return-type = text

