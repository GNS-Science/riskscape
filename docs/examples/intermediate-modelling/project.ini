[project]
description = Example models to demonstrate different modelling techniques

[bookmark Buildings_SE_Upolu]
location = data/Buildings_SE_Upolu.shp

[bookmark SPT_inundation_10m_grid]
location = data/MaxEnv_All_Scenarios_10m.tif

[model sample-centroid]
description = Exposure model that uses centroid spatial sampling
framework = wizard
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_10m.tif
sample.hazards-by = CENTROID
analysis.function = is_exposed
report-event-impact.group-by[0] = 'Total' as Results
report-event-impact.aggregate[0] = count(hazard) as Number_Exposed
report-event-impact.aggregate[1] = count(exposure) as Total_buildings
report-event-impact.aggregate[2] = max(hazard) as Max_hazard
report-event-impact.aggregate[3] = mean(hazard) as Average_hazard

[model sample-closest]
description = Exposure model that uses closest spatial sampling
framework = wizard
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_10m.tif
sample.hazards-by = CLOSEST
analysis.function = is_exposed
report-event-impact.group-by[0] = 'Total' as Results
report-event-impact.aggregate[0] = count(hazard) as Number_Exposed
report-event-impact.aggregate[1] = count(exposure) as Total_buildings
report-event-impact.aggregate[2] = max(hazard) as Max_hazard
report-event-impact.aggregate[3] = mean(hazard) as Average_hazard

[model sample-all-intersections]
description = Exposure model that uses all-intersections spatial sampling
framework = wizard
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_10m.tif
sample.hazards-by = ALL_INTERSECTIONS
analysis.aggregate-hazards = true
analysis.aggregate-hazards-function = max
analysis.function = is_exposed
report-event-impact.group-by[0] = 'Total' as Results
report-event-impact.aggregate[0] = count(hazard) as Number_Exposed
report-event-impact.aggregate[1] = count(exposure) as Total_buildings
report-event-impact.aggregate[2] = max(hazard) as Max_hazard
report-event-impact.aggregate[3] = mean(hazard) as Average_hazard

[model aggregate-hazard]
description = Turns multiple hazard intensities into a single measurement for each building
framework = wizard
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_10m.tif
sample.hazards-by = ALL_INTERSECTIONS
sample.hazards-buffer = 0
analysis.aggregate-hazards = true
analysis.aggregate-hazards-function = mean
analysis.function = Samoa_Building_Fragility_DS5
report-event-impact.filter = hazard > 0
report-event-impact.group-by[0] = 'Total' as Results
report-event-impact.aggregate[0] = count(exposure) as Number_Exposed
report-event-impact.aggregate[1] = percentiles(consequence, [25, 50, 75]) as DS5_Percentile

[model aggregate-consequence]
description = Computes multiple consequences for each building and turns it into a single outcome
framework = wizard
input-exposures.layer = data/Buildings_SE_Upolu.shp
input-exposures.geoprocess = false
input-hazards.layer = data/MaxEnv_All_Scenarios_10m.tif
sample.hazards-by = ALL_INTERSECTIONS
analysis.aggregate-hazards = false
analysis.aggregate-consequences = true
analysis.aggregate-consequences-function = mean
analysis.scale-losses = false
analysis.function = Samoa_Building_Fragility_DS5
report-event-impact.filter = length(hazard) > 0
report-event-impact.group-by[0] = 'Total' as Results
report-event-impact.aggregate[0] = count(exposure) as Number_Exposed
report-event-impact.aggregate[1] = percentiles(consequence, [25, 50, 75]) as DS5_Percentile

[function Samoa_Building_Fragility_DS5]
description = determines the probability of a building being in Damage State 5 (complete structural collapse)
location = functions/Samoa_Building_Fragility_DS5.py
argument-types = [ building: struct(Cons_Frame: text), hazard_depth: nullable(floating) ]
return-type = floating
framework = jython

[function CPython_Building_Fragility_DS5]
description = Same as Samoa_Building_Fragility_DS5, but in CPython
location = functions/CPython_Building_Fragility_DS5.py
argument-types = [ building: struct(Cons_Frame: text), hazard_depth: nullable(floating) ]
return-type = floating
framework = cpython

