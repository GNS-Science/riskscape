[function Volcanic_Multihazard_Info]
framework = cpython
description = '''
Reports the volcanic hazards that are being used in the model, along with any hazard attributes
that are currently missing from the model. Useful for sanity-checking the correct hazard information
is being passed to the vulnerability functions, as the volcanic layers are optional, so some can be omitted.
'''
location = hazard_info.py
argument-types = [multihazard: anything]
return-type = struct(hazards: list(text), missing_attributes: list(text), spurious_attributes: list(text))

# types to map impact states 0-3 to textual descriptions
[type Volcano_Impact_State_Road]
type = enum('No_Disruption', \
            'Skid_Resistence_Reduction', \
            'Impassable_For_Some_Vehicles', \
            'Impassable_If_Tephra_Unconsolidated')

[type Volcano_Impact_State_Rail]
type = enum('No_Disruption', \
            'Speed_Reductions_Timetable_Alterations', \
            'Closure_Possible', \
            'Closure_Likely')

# impact state has the same meaning across water and electricity utilities
[type Volcano_Impact_State_Utility]
type = enum('No_Impact', 'Cleaning_Required', 'Repair_Required', 'Replacement_Or_Expensive_Repair')

[function Volcano_Impact_State_Str]
framework = expression
source = '''
(impact_state, type_str) ->
    # note that RiskScape enums are one-based whereas the Python code uses zero-based definitions
    map(impact_state + 1, IS ->
         # TODO work around cast() arg needing to be a constant string
         if (type_str = 'Volcano_Impact_State_Rail',
             then: str(cast(IS, 'Volcano_Impact_State_Rail')),
             else: if(type_str = 'Volcano_Impact_State_Road',
                      then: str(cast(IS, 'Volcano_Impact_State_Road')),
                      else: str(cast(IS, 'Volcano_Impact_State_Utility'))
                     )
            )
       )
'''
description = Converts an integer impact state (0-3) into a text-string description, e.g. 'Repair_Required'


