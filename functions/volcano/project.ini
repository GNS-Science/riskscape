[project]
description = '''
Vulnerability functions for impact assessment of volcanic hazards on infrastructure,
provided by the New Zealand Institute for Earth Science Limited (Earth Sciences New Zealand).

Based on papers:
  https://appliedvolc.biomedcentral.com/articles/10.1186/s13617-017-0066-5
  https://appliedvolc.biomedcentral.com/articles/10.1186/s13617-017-0065-6
  https://www.sciencedirect.com/science/article/pii/S0377027314002789

Licensed under Creative Commons Attribution-NonCommercial 4.0 International
https://creativecommons.org/licenses/by-nc/4.0/deed.en
'''

[type Volcanic_Hazard]
# Tephra Hazard Intensity Metric (mm)
type.tephra_HIM = nullable(floating)
# Pyroclastic Density Current Hazard Intensity Metric (kPa)
type.pdc_HIM = nullable(floating)
type.lahar_HIM = nullable(floating)
type.crater_HIM = nullable(floating)
type.edifice_HIM = nullable(floating)
type.lava_HIM = nullable(floating)

[type Volcanic_Impact_State]
# the probability of being in a given Impact State (0-3) or greater
# Refer to .py code for more details about what each Impact State means
type.pIS0 = floating
type.pIS1 = floating
type.pIS2 = floating
type.pIS3 = floating
# a randomly assigned Impact State, based on the probabilities
type.impact_state = range(integer, 0, 3)

[function Volcanic_Impact_State_Road]
framework = cpython
description = '''
Vulnerability model for multi-hazard volcanic disruption to a road.
Returns the probability of being in a given Impact State (IS) or greater,
i.e. pIS1 is probability of being in Impact State 1 or greater.
Randomly assigns an overall Impact State based on probabilities and given random seed.
Licensed under Creative Commons Attribution-NonCommercial 4.0 International
https://creativecommons.org/licenses/by-nc/4.0/deed.en
'''
location = vul_roads.py
argument-types = [road: anything, hazard: Volcanic_Hazard, random_seed: nullable(floating)]
return-type = Volcanic_Impact_State

