[project]
description = '''
Bookmarks for exposure-layers, based on data provided by [Toitū Te Whenua Land Information New Zealand](https://www.linz.govt.nz/).
Note that you need to configure a koordinates API key in order to use these bookmarks,
refer to the [README.md](./README.md) for more details
'''

[type LINZ_Exposure]
type.geom = geometry
type.Name = nullable(text)
type.Type = nullable(text)
type.ID = integer

[type LINZ_Region]
type.geom = geometry
type.ID = text
type.Name = text
# I've added an extra Type field here so we can filter out the 'Coastal Bay' features
type.Type = text

[bookmark LINZ_Building_Outlines]
description = '''
Building outlines within mainland NZ.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/101290-nz-building-outlines/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-101290/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = shape
map-attribute.Type = use
map-attribute.Name = if(is_null(name) or name = '', suburb_locality + ', ' + territorial_authority, name)
map-attribute.ID = building_id
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

[bookmark LINZ_Road_Centrelines]
description = '''
Any formed all weather route suitable for the passage of any vehicle.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/50329-nz-road-centrelines-topo-150k/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-50329/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = GEOMETRY
map-attribute.Name = name
map-attribute.Type = if(is_not_null(hway_num), 'highway', surface + ' (' + str(lane_count) + ' lane)')
map-attribute.ID = t50_fid

[bookmark LINZ_Primary_Land_Parcels]
description = '''
Current land parcel polygons with associated descriptive data.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/50823-nz-primary-land-parcels/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-50823/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = shape
map-attribute.Name = appellation + ', ' + land_district
map-attribute.Type = if_null(statutory_actions, parcel_intent)
map-attribute.ID = id
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

[bookmark LINZ_Railway_Centrelines]
description = '''
A permanent way having one or more rails which provides a track for trains or trams.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/50319-nz-railway-centrelines-topo-150k/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-50319/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = GEOMETRY
map-attribute.Name = name
map-attribute.Type = if_null(status, if_null(veh_type, if_null(rway_use, if_null(track_type, 'Unknown'))))
map-attribute.ID = t50_fid

[bookmark LINZ_Rail_Station_Points]
description = '''
A point on a railway line used for the picking up and setting down of passengers or freight.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/50318-nz-rail-station-points-topo-150k/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-50318/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = GEOMETRY
map-attribute.Name = name
map-attribute.ID = t50_fid

[bookmark LINZ_NZ_Facilities]
description = '''
Land boundaries for hospitals and schools in mainland NZ.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/105588-nz-facilities/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-105588/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = shape
map-attribute.Type = use + ': ' + use_type
map-attribute.Name = name
map-attribute.ID = facility_id
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

[bookmark LINZ_NZ_Addresses]
description = '''
The national authoritative dataset for physical addresses in New Zealand.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/105689-nz-addresses/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-105689/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Exposure
map-attribute.geom = shape
map-attribute.Name = full_address
map-attribute.ID = address_id

[bookmark LINZ_Suburbs_and_Localities]
description = '''
The spatial extent and name of communities in urban areas (suburbs) and rural areas (localities).
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Refer to https://data.linz.govt.nz/layer/113764-nz-suburbs-and-localities/ for more details.
Dataset is made available by Toitū Te Whenua – Land Information New Zealand, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://data.linz.govt.nz/license/attribution-4-0-international/ )
'''
location = https://data.linz.govt.nz/services/wfs/layer-113764/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = LINZ_Region
map-attribute.geom = shape
map-attribute.ID = id
map-attribute.Name = name + ', ' + territorial_authority
map-attribute.Type = type
filter = Type != 'Coastal Bay' and Type != 'Lake'
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

