[project]
description = '''
Bookmarks for regional boundaries, based on data provided by StatsNZ.
Note that you need to configure a koordinates API key in order to use these bookmarks,
refer to the [README.md](./README.md) for more details
'''

############################################
# Useful regional bookmarks, types, etc
############################################

[type Region]
type.geom = geometry
type.ID = text
type.Name = text

[bookmark StatsNZ_Statistical_Area_2_2023]
description = '''
Statistical area 2 (SA2) boundaries, clipped to the coastline.
Refer to https://datafinder.stats.govt.nz/layer/111206-statistical-area-2-2023-clipped-generalised/ for more details.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Dataset is made available by StatsNZ, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://datafinder.stats.govt.nz/license/attribution-4-0-international)
'''
location = https://datafinder.stats.govt.nz/services/wfs/layer-111206/?service=WFS&request=GetCapabilities
type = Region
map-attribute.geom = Shape
map-attribute.ID = SA22023_V1_00
map-attribute.Name = SA22023_V1_00_NAME
filter = not(starts_with(Name, 'Inland water'))
requires-secret = koordinates
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

