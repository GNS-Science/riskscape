# for parameter drop-down in the RiskScape platform, use something like
#  param.MY_PARAM_NAME.template = StatsNZ_region
# in your model INI definition
[parameter StatsNZ_region]
properties = bookmark
description = Regional boundaries used to aggregate the model results
choices = "Functional Urban Areas": 'StatsNZ_Functional_Urban_Area_2023'
choices = "Meshblocks" : 'StatsNZ_Meshblock_2023'
choices = "Regional Councils": 'StatsNZ_Regional_Council_2023'
choices = "Statistical Area 2": 'StatsNZ_Statistical_Area_2_2023'
choices = "Territorial Authorities": 'StatsNZ_Territorial_Authorities_2023'
choices = "Urban Rural": 'StatsNZ_Urban_Rural_2023'
choices = "Wards": 'StatsNZ_Ward_2023'

##############################################
# Useful exposure-layer bookmarks, types, etc
##############################################

[type StatsNZ_Exposure]
type.geom = geometry
type.Name = nullable(text)
type.Type = nullable(text)
type.Value = nullable(floating)

[bookmark Estimated_Resident_Population_Grid_250m]
description = '''
A 250 metre population grid using the Estimated Resident Populations (ERP) published annually.
Derived by dividing the Statistical Area 1 (SA1) population estimates by the dwelling locations within each SA1,
and then summed the dwelling population within each grid cell.
Refer to https://datafinder.stats.govt.nz/layer/119709-new-zealand-estimated-resident-population-grid-250-metre/ for more details.
Data is retrieved via WFS and so requires that the user has a 'kordinates' secret configured.
Dataset is made available by StatsNZ, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://datafinder.stats.govt.nz/license/attribution-4-0-international)
'''
location = https://datafinder.stats.govt.nz/services/wfs/layer-119709/?service=WFS&request=GetCapabilities
requires-secret = koordinates
type = StatsNZ_Exposure
map-attribute.geom = Shape
map-attribute.Value = PopEst2023
map-attribute.Type = 'Estimated Resident Population'
map-attribute.Name = GridID
# some features appear as a MultiSurface which need to be linearized.
linearize-tolerance = 0.1

