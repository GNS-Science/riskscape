[project]
description = '''
Bookmarks for exposure-layers, based on data provided by [Transpower New Zealand Limited](https://www.transpower.co.nz/).
Transpower's data is publicly available under the Creative Commons Attribution 4.0 International License
([CC-BY 4.0](https://creativecommons.org/licenses/by/4.0/)).
These datasets were valid as of 28/August/2025 but newer datasets may be available on the
[Transpower open data portal](https://data-transpower.opendata.arcgis.com/)
'''

[type Transpower_Exposure]
type.geom = geometry
type.Name = nullable(text)
type.Type = nullable(text)
type.ID = nullable(integer)

[bookmark Transpower_Transmission_Lines]
description = '''
Transpower New Zealand high-voltage transmission lines (by voltage and type) that make up the national grid.
For more details, refer to https://data-transpower.opendata.arcgis.com/datasets/Transpower::transmission-lines/about 
Dataset is made available by Transpower New Zealand Limited, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://creativecommons.org/licenses/by/4.0)
'''
location = https://hub.arcgis.com/api/v3/datasets/0c8db240553f47b5844bdc2eb1146b9b_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
format = geojson
type = Transpower_Exposure
map-attribute.geom = geometry
map-attribute.Name = description
map-attribute.Type = type + ' ' + str(designvolt) + 'V'
map-attribute.ID = OBJECTID

[bookmark Transpower_Sites]
description = '''
Transpower sites which include AC stations, DC Stations and Tees.
For more details, refer to https://data-transpower.opendata.arcgis.com/datasets/Transpower::sites/about
Dataset is made available by Transpower New Zealand Limited, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://creativecommons.org/licenses/by/4.0)
'''
location = https://hub.arcgis.com/api/v3/datasets/e507953ab8934fc3a115b2e79226cbd6_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
format = geojson
type = Transpower_Exposure
map-attribute.geom = geometry
map-attribute.Name = description
map-attribute.Type = type
map-attribute.ID = OBJECTID

[bookmark Transpower_Substations]
description = '''
Transpower AC stations and DC Stations (i.e. same as Transpower_Sites except Tees are excluded).
For more details, refer to https://data-transpower.opendata.arcgis.com/datasets/Transpower::sites/about
Dataset is made available by Transpower New Zealand Limited, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://creativecommons.org/licenses/by/4.0)
'''
location = https://hub.arcgis.com/api/v3/datasets/e507953ab8934fc3a115b2e79226cbd6_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
format = geojson
type = Transpower_Exposure
map-attribute.geom = geometry
map-attribute.Name = description
map-attribute.Type = type
map-attribute.ID = OBJECTID
filter = if_null(Type, '') != 'TEE'

[bookmark Transpower_Line_Spans]
description = '''
Transpower NZ Transmission Line Spans, i.e. all overhead high-voltage transmission lines.
Similar to Transpower_Transmission_Lines bookmark, except it excludes cables
and lines have been broken up into the spans between poles/towers.
For more details, refer to https://data-transpower.opendata.arcgis.com/datasets/Transpower::spans/about
Dataset is made available by Transpower New Zealand Limited, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://creativecommons.org/licenses/by/4.0)
'''
location = https://hub.arcgis.com/api/v3/datasets/f6fd6fc63633482d9d246961ba650805_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
format = geojson
type = Transpower_Exposure
map-attribute.geom = geometry
map-attribute.Name = description
map-attribute.Type = status
map-attribute.ID = OBJECTID

[bookmark Transpower_Structures]
description = '''
All Transpower high-voltage transmission structures, including poles, towers (pylons), gantries, and termination points.
For more details, refer to https://data-transpower.opendata.arcgis.com/datasets/Transpower::spans/about
Dataset is made available by Transpower New Zealand Limited, licensed under
[Creative Commons 4.0 Creative Commons Attribution 4.0 International](https://creativecommons.org/licenses/by/4.0)
'''
location = https://hub.arcgis.com/api/v3/datasets/630faa14841f4a55af75195e0c88390b_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
format = geojson
type = Transpower_Exposure
map-attribute.geom = geometry
map-attribute.Name = description
map-attribute.Type = LongType
map-attribute.ID = OBJECTID

